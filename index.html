<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender Blog Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Bar -->
    <div id="top-bar" class="glass-panel">
        <!-- Left: Big Blue Button -->
        <button id="big-blue-btn">CLICK ME</button>
        
        <!-- Right: Navigation Menu -->
        <nav class="nav-menu">
            <div class="nav-item active">Home</div>
            <div class="nav-item">Blogs</div>
            <div class="nav-item">About</div>
        </nav>
    </div>

    <!-- Main Container -->
    <div id="main-container">
        <!-- Content Area -->
        <main id="content-area">
            <!-- Blog posts will be rendered here by app.js -->
        </main>

        <!-- Right Sidebar -->
        <aside id="sidebar" class="glass-panel">
            <div class="sidebar-section">
                <div class="sidebar-title">Templates</div>
                <div id="template-list" class="template-list">
                    <!-- Templates will be rendered here by app.js -->
                </div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">Categories</div>
                <div class="template-list">
                    <div class="template-item">
                        <div class="icon-box" style="background:#007aff"></div>
                        <span>Tutorials</span>
                    </div>
                    <div class="template-item">
                        <div class="icon-box" style="background:#ff9500"></div>
                        <span>Shading</span>
                    </div>
                    <div class="template-item">
                        <div class="icon-box" style="background:#ff2d55"></div>
                        <span>Lighting</span>
                    </div>
                    <div class="template-item">
                        <div class="icon-box" style="background:#34c759"></div>
                        <span>Sculpting</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Recent</div>
                <div class="template-list">
                    <div class="template-item" style="font-size:10px; opacity:0.7">
                        Getting Started...
                    </div>
                    <div class="template-item" style="font-size:10px; opacity:0.7">
                        Glass Materials...
                    </div>
                    <div class="template-item" style="font-size:10px; opacity:0.7">
                        Lighting Tips...
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
    <script src="jumpscare.js"></script>
</body>
</html>
