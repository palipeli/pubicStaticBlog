<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>List Test</title>
</head>
<body>
    <h1>Ordered List Test</h1>
    <ol>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
        <li>Fourth item</li>
    </ol>
    
    <h1>With CSS reset test</h1>
    <style>
        /* Simulating potential CSS issue */
        ol {
            list-style: none;
            counter-reset: item;
        }
        ol li {
            display: block;
        }
        ol li:before {
            content: "1. ";
        }
    </style>
    <ol>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
        <li>Fourth item</li>
    </ol>
</body>
</html>
