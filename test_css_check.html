<!DOCTYPE html>
<html>
<head>
<style>
/* Simulating the blog-article styles */
.blog-article ul, .blog-article ol {
    margin: 15px 0 15px 25px;
    color: gray;
    font-family: monospace;
}

.blog-article li {
    margin-bottom: 8px;
    font-family: monospace;
}

/* Testing if .blog-post-content needs its own rules */
</style>
</head>
<body>
<div class="blog-article">
    <h1>Test with blog-article class</h1>
    <ol>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
        <li>Fourth item</li>
    </ol>
</div>

<div class="blog-post-content">
    <h1>Test with blog-post-content class (NO STYLES)</h1>
    <ol>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
        <li>Fourth item</li>
    </ol>
</div>
</body>
</html>
